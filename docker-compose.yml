services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adura
      POSTGRES_PASSWORD: adura
      POSTGRES_DB: adura_development
    volumes:
      - adura_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adura -d adura_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://adura:adura@db:5432/adura_development
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  adura_postgres:
  bundle_cache:
